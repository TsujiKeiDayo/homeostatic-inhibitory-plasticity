[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hnn2"
version = "0.1.0"
description = "homeostaticNN-2: reproducible successor to the homeostatic inhibitory plasticity FYP study"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.1",
    "torchvision>=0.16",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]
umap = ["umap-learn>=0.5"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rs"
pythonpath = ["src"]
